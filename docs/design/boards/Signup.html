<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&amp;display=swap">
<style>body{margin:0}button{font:inherit;cursor:pointer}.card:hover{background:#1d1c29!important}</style>

<title>Vibra Sign up</title>
</head>
<body>

<div style="width:100%;min-width:1100px;height:900px;display:grid;grid-template-columns:1fr 1fr;background:#0b0a10;color:#f4f3f8;font-family:'Plus Jakarta Sans',sans-serif">
<section style="position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 48px">
<div style="position:absolute;top:36px;left:48px;font-size:28px;font-weight:800">vibra<span style="color:#e8334f">.</span></div>
<div style="width:min(400px,100%);display:flex;flex-direction:column;gap:18px">
<div><h1 style="margin:0;font-size:34px;font-weight:800">Create your account</h1><p style="margin:8px 0 0;font-size:15px;color:#a9a7bd">Save playlists, likes and history, and play anywhere.</p></div>
<button style="display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #3a3850;background:none;color:#f4f3f8;border-radius:999px;height:52px;font-weight:600;font-size:15px">Continue with Google</button>
<div style="display:flex;align-items:center;gap:14px;color:#6f6d86;font-size:12px"><span style="flex:1;height:1px;background:#23212f"></span>or<span style="flex:1;height:1px;background:#23212f"></span></div>
<label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#a9a7bd">Email<span style="display:flex;align-items:center;justify-content:space-between;background:#1f1e2b;border:1px solid #2c2a3e;border-radius:12px;padding:0 16px;height:52px;font-size:15px;color:#6f6d86;font-weight:400">you@example.com</span></label><label style="display:flex;flex-direction:column;gap:8px;font-size:13px;font-weight:600;color:#a9a7bd">Password<span style="display:flex;align-items:center;justify-content:space-between;background:#1f1e2b;border:1px solid #2c2a3e;border-radius:12px;padding:0 16px;height:52px;font-size:15px;color:#6f6d86;font-weight:400">At least 8 characters<span style="color:#a9a7bd;display:flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span></span></label>
<button style="border:0;background:#e8334f;color:#fff;border-radius:999px;height:54px;font-weight:800;font-size:16px;margin-top:4px">Sign up</button>
<p style="margin:0;font-size:12px;line-height:1.5;color:#8886a0;text-align:center">By signing up you agree to the Terms and the Privacy Policy.</p><div style="text-align:center;font-size:14px;color:#a9a7bd">Already have an account? <b style="color:#f4f3f8">Log in</b></div>
</div></section>
<section style="position:relative;overflow:hidden;background:linear-gradient(160deg,#4a1e2a,#1a1220 70%);display:flex;align-items:flex-end;padding:56px">
<span style="position:absolute;width:260px;height:260px;border-radius:24px;background:linear-gradient(135deg,#c2784a,#5a1a2a);left:150px;top:150px;transform:rotate(-8deg);box-shadow:0 30px 60px #0007"></span><span style="position:absolute;width:220px;height:220px;border-radius:24px;background:linear-gradient(135deg,#3a2a8a,#7a4ae8);left:330px;top:330px;transform:rotate(7deg);box-shadow:0 30px 60px #0007"></span><span style="position:absolute;width:190px;height:190px;border-radius:24px;background:linear-gradient(135deg,#1d4a3a,#4ac2a0);left:90px;top:430px;transform:rotate(-4deg);box-shadow:0 30px 60px #0007"></span><div style="position:relative;font-size:30px;font-weight:800;line-height:1.2;max-width:380px">Your music, wherever you play.</div></section>
</div>

</body>
</html>
