<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vibra — Android Home</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#0B0A12}
.ph{font-family:'DM Sans',sans-serif;color:#F2F0FA;background:#0F0D18;width:390px;height:844px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fi{fill:currentColor;stroke:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid #A78BFA;outline-offset:2px}
h1,h2{font-family:'Bricolage Grotesque',sans-serif;margin:0}
.cv{border-radius:16px;flex:none;position:relative;overflow:hidden}
.cv:after{content:"";position:absolute;width:52%;height:52%;border-radius:50%;right:-10%;bottom:-10%;background:rgba(255,255,255,.22)}
.chip{height:40px;padding:0 16px;border-radius:12px;border:1px solid #3B3556;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{background:#3A2F66;border-color:#3A2F66;color:#E5DCFF}
.qa{display:flex;align-items:center;gap:10px;background:#1C1829;border-radius:16px;height:64px;padding:0 12px 0 8px;text-align:left;font-weight:700;font-size:14px;min-width:0}
.mut{color:#A9A6BD}.sm{font-size:14px}
.row{display:flex;align-items:center;gap:12px;height:64px}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:#A9A6BD}
.nv span.p{width:64px;height:32px;border-radius:16px;display:grid;place-items:center}
.nv.on{color:#F2F0FA}.nv.on span.p{background:#3A2F66}
</style>
</helmet>
<div class="ph">
<div style="flex:1;overflow:hidden;padding:48px 16px 0;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;gap:8px;height:56px;border-radius:28px;background:#1C1829;padding:0 8px 0 20px"><svg class="i mut" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><span class="mut" style="flex:1">Search songs, artists, albums…</span><span style="width:40px;height:40px;border-radius:50%;background:#A78BFA;color:#0B0A12;display:grid;place-items:center;font-weight:700;font-size:13px">SN</span></div>
<div><div class="mut sm">Monday, September 26</div><h1 style="font-size:32px;line-height:1.1;margin-top:2px">Good evening, Samuel</h1></div>
<div style="display:flex;gap:8px;overflow:hidden"><button class="chip on">All</button><button class="chip">Music</button><button class="chip">Made for you</button><button class="chip">New</button></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<button class="qa"><div class="cv" style="width:48px;height:48px;border-radius:12px;background:#5B3FD0"></div>Liked Songs</button>
<button class="qa"><div class="cv" style="width:48px;height:48px;border-radius:12px;background:#1F4E5F"></div>Chill Vibes</button>
<button class="qa"><div class="cv" style="width:48px;height:48px;border-radius:12px;background:#8A3A1F"></div>Workout</button>
<button class="qa"><div class="cv" style="width:48px;height:48px;border-radius:12px;background:#2F5A3A"></div>Focus</button>
</div>
<section>
<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px"><h2 style="font-size:22px">Recently played</h2><span class="mut sm" style="font-weight:700">History</span></div>
<div style="display:flex;gap:12px;overflow:hidden">
<div style="width:140px;flex:none"><div class="cv" style="width:140px;height:140px;border-radius:24px;background:#4A3280"></div><div style="font-weight:700;margin-top:8px">Snooze</div><div class="mut sm">SZA</div></div>
<div style="width:140px;flex:none"><div class="cv" style="width:140px;height:140px;border-radius:24px;background:#1F4E5F"></div><div style="font-weight:700;margin-top:8px">Saturn</div><div class="mut sm">SZA</div></div>
<div style="width:140px;flex:none"><div class="cv" style="width:140px;height:140px;border-radius:24px;background:#7A2438"></div><div style="font-weight:700;margin-top:8px">Die For You</div><div class="mut sm">The Weeknd</div></div>
</div>
</section>
<section>
<h2 style="font-size:22px;margin-bottom:4px">Your rotation</h2>
<div class="row"><div class="cv" style="width:48px;height:48px;border-radius:12px;background:#2C4A5E"></div><div style="flex:1;min-width:0"><div style="font-weight:700">Space Song</div><div class="mut sm">Beach House</div></div><span class="mut sm">5:20</span></div>
</section>
</div>

<!-- mini player -->
<div style="margin:0 8px 8px;background:#2A2440;border-radius:20px;padding:8px 8px 12px;position:relative;flex:none">
<div style="display:flex;align-items:center;gap:12px"><div class="cv" style="width:48px;height:48px;border-radius:14px;background:#4A3280"></div><div style="flex:1;min-width:0"><div style="font-weight:700">Snooze</div><div class="mut sm">SZA</div></div>
<button aria-label="Unlike" style="width:48px;height:48px;display:grid;place-items:center;color:#A78BFA"><svg class="i fi" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg></button>
<button aria-label="Pause" style="width:48px;height:48px;border-radius:50%;background:#A78BFA;color:#0B0A12;display:grid;place-items:center"><svg class="i fi" viewBox="0 0 24 24"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg></button></div>
<div style="position:absolute;left:16px;right:16px;bottom:5px;height:3px;background:#3F3860;border-radius:2px"><div style="width:51%;height:100%;background:#A78BFA;border-radius:2px"></div></div>
</div>

<!-- nav bar -->
<nav style="display:flex;height:80px;box-sizing:border-box;padding:12px 0 16px;background:#1C1829;flex:none">
<button class="nv on"><span class="p"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Home</button>
<button class="nv"><span class="p"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></span>Search</button>
<button class="nv"><span class="p"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg></span>Discover</button>
<button class="nv"><span class="p"><svg class="i" viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 5l5 15"></path></svg></span>Library</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
