name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Web Dependencies
      run: |
        npm install --legacy-peer-deps

    - name: Build Web App
      run: |
        npm run build

    - name: Package OTA bundle
      run: |
        cd dist
        zip -qr ../vybra-bundle.zip .

    - name: Sync Capacitor Android Assets
      run: |
        npx cap sync android

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: 'true'
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vybra-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: Publish APK + OTA bundle to nightly release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cp android/app/build/outputs/apk/debug/app-debug.apk vybra-latest.apk
        gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create nightly --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Vybra nightly build" \
            --notes "Latest APK + OTA web bundle built by CI. Rebuilt on every push to main."
        gh release upload nightly vybra-latest.apk vybra-bundle.zip \
          --repo "$GITHUB_REPOSITORY" --clobber
        # The notes carry the bundle id the app matches against (api.github.com
        # is CORS-open; the asset host is not). Edited after the upload so a
        # device never sees a bundleId whose zip is not live yet.
        gh release edit nightly --repo "$GITHUB_REPOSITORY" \
          --notes "Bundle: nightly-${GITHUB_SHA:0:7} — Latest APK + OTA web bundle built by CI. Rebuilt on every push to main."